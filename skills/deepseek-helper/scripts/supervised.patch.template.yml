# Invocation-local supervised helper. Native tools disabled; custom snapshot tools only.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max

- id: tools
  config:
    mode: native

- id: headless-runner
  inject: [headlessStartup, codexSupervisorGuard]

- insert:
    - id: codex-supervisor-guard
      name: __GUARD_MODULE_URL__

- id: tool-plugin-manager
  disabled: true
